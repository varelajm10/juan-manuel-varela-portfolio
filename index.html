        <h1>Juan Manuel Varela</h1>
        <p>Profesional independiente. Automatización, software e inteligencia artificial para empresas. Buenos Aires, Argentina. Trabajo remoto.</p>
        <p>Diez años en Saputo, DACAS y CNH, entre créditos, cobranzas y conciliaciones. Desde 2024 diseña e implementa sistemas de automatización, portales internos e IA en producción (CoopMora, SECSA e Intranet RRHH), combinando más de una década de criterio financiero y operativo con desarrollo de software.</p>
        <p>Contacto: juan@jmvarela.dev · +54 9 11 3069-1984 · https://www.linkedin.com/in/juan-m-varela1984 · https://github.com/varelajm10</p>
        <h2>Trayectoria</h2>
        <p>Consultor de Automatización, Procesos y Desarrollador de Soluciones. Proyectos en producción, remoto. Mayo 2024 — actualidad. CoopMora, CUBO — plataforma de créditos y cobranzas para empresas, SECSA y Portal Comunidad, intranet de autogestión de RRHH para licencias, vacaciones, adelantos de sueldo, comunicados, directorio y mesa de ayuda de Sistemas.</p>
        <p>DACAS, operación regional LATAM. Analista senior de créditos, cobranzas y operaciones. Marzo 2025 — febrero 2026.</p>
        <p>Saputo Inc. Analista senior de gestión de cartera y datos. Julio 2018 — mayo 2024.</p>
        <p>XCMG - CNH Capital. Analista de procesos y cuentas. Octubre 2016 — junio 2018.</p>
        <p>CCU Argentina. Analista de reportes y gestión operativa. Octubre 2014 — septiembre 2016.</p>
        <h2>Proyectos destacados y sistemas en producción</h2>
        <p>Agente de IA de cobranzas y scoring de riesgo. Motor en Python con puntaje 0–100 y redactor con fallback.</p>
        <p>Motor de conciliación bancaria. 97.2% de imputación automática sobre extractos de prueba.</p>
        <p>Metanoia. Prototipos públicos de panel y ERP. La herramienta con datos de la operación sigue en un repositorio privado.</p>
        <p>CUBO — Plataforma de créditos y cobranzas para empresas. Sistema multiempresa que integra análisis de antigüedad de deuda, alertas de cobro y consultas automatizadas mediante Telegram.</p>
        <p>G.L.A.D.Y.S. / CoopMora, radar de riesgo crediticio y BCRA. Pipeline diario de situación crediticia y concursos, procesado con modelos de lenguaje.</p>
        <p>AscenSort. Sistema de incidencias para ascensores y escaleras mecánicas, con reportes y un agente de auditorías con IA. Desarrollado para RB&amp;LCA.</p>
        <p>Portal Comunidad, intranet y autogestión de RRHH. Solicitud y saldo de vacaciones y licencias, adelantos de sueldo, directorio de personal, credencial ART y tickets de soporte IT.</p>
        <h2>Habilidades</h2>
        <p>Créditos y cobranzas, conciliaciones, DSO y aging. Python, Power BI, DAX y SQL. React y Tailwind CSS para intranets de autogestión y tableros operativos. SAP FI/AR, Odoo, FastAPI y Git.</p>
        <h2>Formación</h2>
        <p>Licenciatura en Administración de Empresas, UAI. Cursada completa. Tesis en elaboración. Python, UTN. Power BI: DAX y modelado de datos. Anthropic Academy. Google Gemini. Inglés B2. Español nativo.</p>
