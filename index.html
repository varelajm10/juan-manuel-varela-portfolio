        <h1>Transformo procesos manuales en soluciones digitales.</h1>
        <p>Juan Manuel Varela, profesional independiente. Automatización de procesos, software empresarial e inteligencia artificial aplicada a negocios. Buenos Aires, Argentina. Trabajo remoto.</p>
        <p>Combino más de 10 años de experiencia en procesos empresariales con desarrollo tecnológico para crear automatizaciones, aplicaciones y soluciones de inteligencia artificial que resuelven problemas reales de negocio.</p>
        <p>Contacto: juan@jmvarela.dev · +54 9 11 3069-1984 · https://www.linkedin.com/in/juan-m-varela1984 · https://github.com/varelajm10</p>
        <h2>Trayectoria</h2>
        <p>Consultor de Automatización, Procesos y Desarrollador de Soluciones. Proyectos en producción, remoto. Mayo 2024 — actualidad. CoopMora, CUBO — plataforma de créditos y cobranzas para empresas, SECSA y Portal Comunidad, intranet de autogestión de RRHH para licencias, vacaciones, adelantos de sueldo, comunicados, directorio y mesa de ayuda de Sistemas.</p>
        <p>DACAS, operación regional LATAM. Analista senior de créditos, cobranzas y operaciones. Marzo 2025 — febrero 2026.</p>
        <p>Saputo Inc. Analista senior de gestión de cartera y datos. Julio 2018 — mayo 2024.</p>
        <p>XCMG - CNH Capital. Analista de procesos y cuentas. Octubre 2016 — junio 2018.</p>
        <p>CCU Argentina. Analista de reportes y gestión operativa. Octubre 2014 — septiembre 2016.</p>
        <h2>Proyectos y soluciones desarrolladas</h2>
        <p>Agente de IA de cobranzas y scoring de riesgo. Prototipo funcional: motor en Python con puntaje 0–100, redactor con controles y 16 tests.</p>
        <p>Motor de conciliación bancaria. Proyecto técnico verificable. En un extracto de prueba, el motor concilió automáticamente el 97,2 % del importe total de los créditos.</p>
        <p>Metanoia. Prototipo funcional: panel y ERP públicos. La herramienta usada con datos de la operación está en un repositorio privado.</p>
        <p>CUBO — Plataforma de créditos y cobranzas para empresas. Producto propio: antigüedad de deuda, alertas de cobro y consultas por Telegram.</p>
        <p>CUBO INSPECTA. Producto propio para auditorías e inspecciones, independiente de los proyectos de clientes.</p>
        <p>G.L.A.D.Y.S. / CoopMora. Implementación empresarial: pipeline diario de situación crediticia en el BCRA y concursos, con un informe para el equipo de créditos.</p>
        <p>AscenSort. Desarrollo para cliente: sistema de incidencias para ascensores y escaleras mecánicas, con reportes y un agente de auditorías con IA. Desarrollado para RB&amp;LCA.</p>
        <p>Portal Comunidad. Implementación empresarial: intranet de autogestión de RRHH para licencias, vacaciones, adelantos de sueldo, directorio, credencial ART y tickets de soporte.</p>
        <h2>Habilidades</h2>
        <p>Créditos y cobranzas, conciliaciones, DSO y aging. Python, Power BI, DAX y SQL. React y Tailwind CSS para intranets de autogestión y tableros operativos. SAP FI/AR, Odoo, FastAPI y Git.</p>
        <h2>Formación</h2>
        <p>Licenciatura en Administración de Empresas, UAI. Cursada completa. Tesis en elaboración. Python, UTN. Power BI: DAX y modelado de datos. Anthropic Academy. Google Gemini. Inglés B2. Español nativo.</p>
